<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý tài khoản đăng nhập game</title>
<meta name="description" content="Công cụ quản lý tài khoản Garena, Gmail và Facebook cho game">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // Chống chớp sáng khi tải giao diện tối
  (function() {
    const t = localStorage.getItem('app_theme');
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="header-inner">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput">
    </div>
    <div class="header-actions">
      <button class="header-icon-btn btn-delete-all" onclick="App.deleteAllAccounts()" title="Xoá tất cả tài khoản">
        <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
      <button class="header-icon-btn btn-reset" onclick="App.resetAllEvents()" title="Reset sự kiện (tất cả tài khoản)">
        <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
      <button class="header-icon-btn" id="themeToggle" title="Đổi giao diện sáng/tối">
        <!-- Icon chèn qua JS -->
      </button>
    </div>
  </div>
</header>

<!-- ===== 3 BẢNG ===== -->
<main class="main">

  <!-- GARENA -->
  <section class="panel" id="panelGarena">
    <div class="panel-header">
      <h2>Garena</h2>
      <div class="counters" id="countersGarena"></div>
    </div>
    <div class="panel-actions">
      <button class="panel-action-btn btn-add" onclick="App.openAddModal('garena')" title="Thêm tài khoản">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="panel-action-btn" onclick="App.openExportModal('garena')" title="Xuất dữ liệu (Export CSV / JSON)">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
      <button class="panel-action-btn" onclick="App.openImportModal('garena')" title="Nhập dữ liệu từ Excel (Import)">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      </button>
    </div>
    <div class="account-list" id="listGarena"></div>
    <div class="panel-pagination" id="paginationGarena"></div>
  </section>

  <!-- GMAIL -->
  <section class="panel" id="panelGmail">
    <div class="panel-header">
      <h2>Gmail</h2>
      <div class="counters" id="countersGmail"></div>
    </div>
    <div class="panel-actions">
      <button class="panel-action-btn btn-add" onclick="App.openAddModal('gmail')" title="Thêm tài khoản">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="panel-action-btn" onclick="App.openExportModal('gmail')" title="Xuất dữ liệu (Export CSV / JSON)">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
      <button class="panel-action-btn" onclick="App.openImportModal('gmail')" title="Nhập dữ liệu từ Excel (Import)">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      </button>
    </div>
    <div class="account-list" id="listGmail"></div>
    <div class="panel-pagination" id="paginationGmail"></div>
  </section>

  <!-- FACEBOOK -->
  <section class="panel" id="panelFacebook">
    <div class="panel-header">
      <h2>Facebook</h2>
      <div class="counters" id="countersFacebook"></div>
    </div>
    <div class="panel-actions">
      <button class="panel-action-btn btn-add" onclick="App.openAddModal('facebook')" title="Thêm tài khoản">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="panel-action-btn" onclick="App.openExportModal('facebook')" title="Xuất dữ liệu (Export CSV / JSON)">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
      <button class="panel-action-btn" onclick="App.openImportModal('facebook')" title="Nhập dữ liệu từ Excel (Import)">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      </button>
    </div>
    <div class="account-list" id="listFacebook"></div>
    <div class="panel-pagination" id="paginationFacebook"></div>
  </section>
</main>

<!-- MODAL: THÊM -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="addModalTitle">Thêm tài khoản</h3>
      <button class="btn-close" onclick="App.closeModal('addModal')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="addForm" onsubmit="return App.submitAddForm(event)">
        <div id="addFormFields"></div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="App.closeModal('addModal')">Huỷ</button>
      <button class="btn btn-primary" onclick="App.submitAddForm()">Thêm</button>
    </div>
  </div>
</div>

<!-- MODAL: SỬA -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="editModalTitle">Sửa thông tin tài khoản</h3>
      <button class="btn-close" onclick="App.closeModal('editModal')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="editForm" onsubmit="return App.submitEditForm(event)">
        <div id="editFormFields"></div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="App.closeModal('editModal')">Huỷ</button>
      <button class="btn btn-primary" onclick="App.submitEditForm()">Lưu thay đổi</button>
    </div>
  </div>
</div>

<!-- MODAL: IMPORT -->
<div class="modal-overlay" id="importModal">
  <div class="modal" style="max-width:620px">
    <div class="modal-header">
      <h3 id="importModalTitle">Import tài khoản</h3>
      <button class="btn-close" onclick="App.closeModal('importModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Dán dữ liệu từ Excel (mỗi dòng 1 tài khoản, các cột cách nhau bằng Tab)</label>
        <textarea id="importTextarea" class="import-textarea" rows="5"></textarea>
      </div>
      <div class="import-hint-box">
        <span class="import-hint-label">Thứ tự cột:</span>
        <span id="importColumnHint"></span>
      </div>
      <div style="display:flex; justify-content:flex-start;">
        <button class="btn btn-outline btn-sm" onclick="App.previewImport()">
          👁 Xem trước dữ liệu
        </button>
      </div>
      <div id="importPreview"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="App.closeModal('importModal')">Huỷ</button>
      <button class="btn btn-primary" id="importConfirmBtn" onclick="App.confirmImport()" disabled>Xác nhận Import</button>
    </div>
  </div>
</div>

<!-- MODAL: EXPORT -->
<div class="modal-overlay" id="exportModal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3 id="exportModalTitle">Export tài khoản</h3>
      <button class="btn-close" onclick="App.closeModal('exportModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="export-options">
        <div class="export-card" onclick="App.doExport('csv')">
          <div class="export-label">CSV</div>
          <div class="export-desc">Mở được bằng Excel</div>
        </div>
        <div class="export-card" onclick="App.doExport('json')">
          <div class="export-label">JSON</div>
          <div class="export-desc">Backup đầy đủ dữ liệu</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- JavaScript Logic -->
<script src="script.js"></script>
</body>
</html>
